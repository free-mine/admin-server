services:
  admin-server:
    build: .
    image: ore-vein-admin-server:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PRIVATE_KEY: ${PRIVATE_KEY:?Set PRIVATE_KEY}
      RPC_URL: ${RPC_URL:?Set RPC_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - admin-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    init: true

volumes:
  admin-data:
